<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muhim bo‘limlar</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#18202a}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010}.btn{border:0;border-radius:12px;padding:13px 15px;margin:5px 0;width:100%;font-size:16px;background:#eaf0f8}.primary{background:#1f5eff;color:white}.muted{color:#687386;font-size:14px}.q{font-size:17px;line-height:1.45}.opt{display:block;width:100%;padding:12px;margin:7px 0;border:1px solid #dbe2ea;border-radius:10px;background:white;text-align:left}.hidden{display:none}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd5e0;border-radius:10px;font-size:16px}</style></head><body><div class="wrap"><h2>🎓 Milliy sertifikatga tayyorgarlik</h2><p class="muted">Testlar, javoblar, xatolar va diagnostik natija.</p><section id="home" class="card"><button class="btn primary" id="load">🧪 Testlarni ko‘rish</button><button class="btn" id="codeBtn">🔑 Test kodi bilan kirish</button><div id="tests"></div></section><section id="test" class="card hidden"><div id="progress" class="muted"></div><div id="question" class="q"></div><div id="answer"></div><button class="btn primary" id="next">Keyingi</button></section><section id="result" class="card hidden"></section></div><script>const tg=window.Telegram?.WebApp; if(tg)tg.ready();const API=location.origin;let T=null,idx=0,answers={};function el(id){return document.getElementById(id)}async function load(){const r=await fetch(API+'/api/national/tests');const d=await r.json();el('tests').innerHTML=(d.tests||[]).map(x=>`<button class="btn" data-code="${x.code}">🔑 ${x.code} — ${x.title}</button>`).join('')||'<p class="muted">Hozircha test yo‘q.</p>';document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>start(b.dataset.code))}async function start(code){const r=await fetch(API+'/api/national/test/'+encodeURIComponent(code));const d=await r.json();if(!d.ok){alert(d.error);return}T=d.test;idx=0;answers={};el('home').classList.add('hidden');el('test').classList.remove('hidden');show()}function show(){const q=T.questions[idx];el('progress').textContent=`${idx+1}/${T.questions.length} • ${q.type}`;el('question').textContent=q.text;let a='';if(q.type==='Y1'||q.type==='Y2'){a=(q.options||['A','B','C','D']).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')}else if(q.type==='O1'){a='<input id="open" placeholder="Javobingizni yozing">'}else{a='<input id="a" placeholder="A javobini yozing"><input id="b" placeholder="B javobini yozing">'}el('answer').innerHTML=a;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.style.fontWeight='normal');b.style.fontWeight='700';answers[idx+1]=b.dataset.v});}el('next').onclick=async()=>{const q=T.questions[idx];if(q.type==='O1')answers[idx+1]=el('open').value.trim();if(q.type==='O1AB')answers[idx+1]=[el('a').value.trim(),el('b').value.trim()];if(!answers[idx+1]||(Array.isArray(answers[idx+1])&&answers[idx+1].some(x=>!x))){alert('Javobni kiriting');return}idx++;if(idx<T.questions.length)show();else submit()};async function submit(){const uid=tg?.initDataUnsafe?.user?.id||0;const r=await fetch(API+'/api/national/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:T.code,user_id:uid,answers})});const d=await r.json();el('test').classList.add('hidden');el('result').classList.remove('hidden');if(!d.ok){el('result').innerHTML='❌ '+d.error;return}el('result').innerHTML=`<h3>🏆 Yakuniy natija</h3><p>Test: <b>${d.score_75}/75</b></p><p>Daraja: <b>${d.level}</b></p><p>Esse: <b>${d.essay_score??'—'}/24</b></p><h4>❌ Xatolar: ${d.errors.length}</h4>`+(d.errors||[]).map(x=>`<div class="card"><b>${x.number}-savol</b><br>Siz: ${JSON.stringify(x.user)}<br>To‘g‘ri: ${JSON.stringify(x.correct)}<br>${x.explanation||''}</div>`).join('')+'<p class="muted">Bu diagnostik simulyatsiya bo‘lib, davlat sertifikati emas.</p>'}el('load').onclick=load;el('codeBtn').onclick=()=>{const c=prompt('Test kodini kiriting');if(c)start(c)};load();</script></body></html>
